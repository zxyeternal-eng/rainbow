<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="description" content="装备数据分析系统 · 设备故障分析 / 五金配件防呆 / 设备核心件预保养">
<title>装备数据分析系统</title>
<link rel="icon" type="image/png" href="./icon.png">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f4f6fa}
  #app{display:block;width:100%;height:100%;border:0}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
           background:#f4f6fa;z-index:2;transition:opacity .35s ease;
           font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:#64748b}
  #loading.hide{opacity:0;pointer-events:none}
  #loading .box{text-align:center}
  #loading img{width:52px;height:52px;border-radius:12px;box-shadow:0 4px 14px rgba(8,20,50,.18);margin-bottom:14px}
  #tip{position:fixed;right:12px;bottom:12px;z-index:3;font:13px/1.4 system-ui,"Microsoft YaHei",sans-serif;
       color:#1d4ed8;background:#fff;border:1px solid #c7d8f5;border-radius:8px;
       padding:7px 12px;box-shadow:0 2px 10px rgba(8,20,50,.12);text-decoration:none}
  #tip:hover{background:#eef4ff}
</style>
</head>
<body>
<div id="loading"><div class="box"><img src="./icon.png" alt=""><div>正在打开装备数据分析系统…</div></div></div>
<iframe id="app" title="装备数据分析系统" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<a id="tip" href="#" target="_blank" rel="noopener">页面样式异常？点此打开完整版 →</a>
<script>
(function () {
  // 数据源仍是 WorkBuddy 共享库；本页只做自有域名外壳，数据链路原样保留。
  // 云端接口有 Origin 白名单，静态搬站会 403，因此必须保持 iframe 内为原域名同源。
  var BASE = 'https://2119779693255380992.app.workbuddy.host/';
  var DEFAULT_SHARECODE = 'NCYAMJXSCH';
  var q = new URLSearchParams(location.search);
  if (!q.has('sharecode')) q.set('sharecode', DEFAULT_SHARECODE);
  var target = BASE + '?' + q.toString();
  var frame = document.getElementById('app');
  var loading = document.getElementById('loading');
  frame.addEventListener('load', function () { loading.classList.add('hide'); });
  frame.src = target;
  document.getElementById('tip').href = target;
  setTimeout(function () { loading.classList.add('hide'); }, 12000);
})();
</script>
</body>
</html>
